name: Verify

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Read the pinned Ashita libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AshitaXI/Ashita-v4beta
          ref: 4171c74c8ddb2ca2a31654f199e6c1cee40d7256
          path: .ci/ashita
          sparse-checkout: addons/libs
          persist-credentials: false

      - name: Check the repository
        run: python tools/check_repository.py

      # The other Python tests open a window or read the game's art, and a runner has neither.
      - name: Run the tests that need no game or window
        env:
          ASHITA_LIBS: ${{ github.workspace }}/.ci/ashita/addons/libs
        run: |
          python tests/run.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in 'client_check', 'install_addon', 'package', 'share_native', 'share_read_time', 'store_native') {
            python "tests/test_$test.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
